services:
  postgres:
    image: postgres:16-alpine
    container_name: mealtrack-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: mealtrack
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - mealtrack_postgres_data:/var/lib/postgresql/data
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./backend/database/apply-schema.sh:/docker-entrypoint-initdb.d/02-apply-schema.sh
      - ./backend/database/schema.sql:/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: mealtrack-backend
    environment:
      DB_HOST: postgres
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_PORT: 5432
      REEF_API_KEY: ${REEF_API_KEY:-}
      MEALTRACK_SECRET: ${MEALTRACK_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:3000,http://localhost:5173}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    container_name: mealtrack-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mealtrack_postgres_data:
